<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versa - Asisten Pribadi</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-chatbox: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --user-bubble: #2563eb;
            --user-text: #ffffff;
            --assistant-bubble: #f1f5f9;
            --assistant-text: #1e293b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        aside { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 10; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .sidebar-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .new-chat-btn { margin: 16px; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .new-chat-btn:hover { background: var(--primary-hover); }
        .history-list { flex: 1; overflow-y: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 6px; }
        .history-item { padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s; }
        .history-item:hover { background: var(--bg-main); color: var(--text-main); }

        /* Main Chat Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-main); position: relative; }
        
        header { background: var(--bg-sidebar); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .header-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 36px; height: 36px; background: #dbeafe; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; }
        .header-text h1 { font-size: 1rem; font-weight: 600; }
        .header-text span { font-size: 0.75rem; color: #16a34a; display: flex; align-items: center; gap: 4px; }
        .header-text span::before { content: ""; display: inline-block; width: 6px; height: 6px; background-color: #16a34a; border-radius: 50%; }

        #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        
        .message-wrapper { display: flex; gap: 12px; max-width: 80%; }
        .message-wrapper.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-wrapper.assistant { align-self: flex-start; }

        .message { padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; word-wrap: break-word; box-shadow: var(--shadow); white-space: pre-wrap; }
        .user .message { background: var(--user-bubble); color: var(--user-text); border-top-right-radius: 2px; }
        .assistant .message { background: var(--assistant-bubble); color: var(--assistant-text); border: 1px solid var(--border-color); border-top-left-radius: 2px; }

        /* Quick Prompts */
        .quick-prompts { padding: 0 24px 12px; display: flex; gap: 8px; overflow-x: auto; }
        .prompt-chip { background: var(--bg-sidebar); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .prompt-chip:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }

        /* Input Area */
        #input-container { padding: 16px 24px; background: var(--bg-sidebar); border-top: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; }
        .input-box-wrapper { flex: 1; display: flex; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 16px; align-items: center; transition: border-color 0.2s; }
        .input-box-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        input { flex: 1; border: none; background: transparent; outline: none; font-size: 0.95rem; color: var(--text-main); }
        
        button.send-btn { background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
        button.send-btn:hover { background: var(--primary-hover); }
        button.send-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            aside { display: none; } /* Bisa diatur nanti kalau mau pakai drawer */
            .message-wrapper { max-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div class="sidebar-header">
            <div class="sidebar-title">⚡ Versa AI</div>
        </div>
        <button class="new-chat-btn" onclick="resetChat()">+ Percakapan Baru</button>
        <div style="padding: 0 16px; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px;">RIWAYAT</div>
        <div class="history-list" id="history-list">
            <div class="history-item">Sesi Obrolan Aktif</div>
        </div>
    </aside>

    <!-- Main Chat Room -->
    <div class="main-chat">
        <header>
            <div class="header-info">
                <div class="avatar">V</div>
                <div class="header-text">
                    <h1>Versa</h1>
                    <span>Online & Siap Membantu</span>
                </div>
            </div>
        </header>

        <div id="chat-container">
            <div class="message-wrapper assistant">
                <div class="avatar" style="width: 28px; height: 28px; font-size: 0.8rem;">V</div>
                <div class="message">Halo Yusup! Saya Versa, asisten pribadi setiamu. Ada yang bisa kubantu hari ini?</div>
            </div>
        </div>

        <!-- Quick Suggestions -->
        <div class="quick-prompts">
            <div class="prompt-chip" onclick="sendPreset('Tuliskan ide proyek web kreatif')">💡 Ide Proyek Web</div>
            <div class="prompt-chip" onclick="sendPreset('Bantu buatkan draf email profesional')">✉️ Buat Draf Email</div>
            <div class="prompt-chip" onclick="sendPreset('Jelaskan konsep dasar logika JavaScript')">💻 Belajar JavaScript</div>
            <div class="prompt-chip" onclick="sendPreset('Berikan tips produktivitas harian')">✨ Tips Produktivitas</div>
        </div>

        <div id="input-container">
            <div class="input-box-wrapper">
                <input type="text" id="user-input" placeholder="Ketik pesan atau tanyakan sesuatu pada Versa..." autofocus>
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        function sendPreset(text) {
            userInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            scrollToBottom();

            const loadingId = appendMessage('Versa sedang mengetik...', 'assistant');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                document.getElementById(loadingId).innerText = data.reply || 'Maaf, terjadi kesalahan.';
            } catch (error) {
                document.getElementById(loadingId).innerText = 'Gagal terhubung ke server Versa.';
            }
            scrollToBottom();
        }

        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;

            if (sender === 'assistant') {
                const av = document.createElement('div');
                av.className = 'avatar';
                av.style.width = '28px';
                av.style.height = '28px';
                av.style.fontSize = '0.8rem';
                av.innerText = 'V';
                wrapper.appendChild(av);
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgDiv.innerText = text;
            
            wrapper.appendChild(msgDiv);
            chatContainer.appendChild(wrapper);
            scrollToBottom();
            return id;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function resetChat() {
            chatContainer.innerHTML = `
                <div class="message-wrapper assistant">
                    <div class="avatar" style="width: 28px; height: 28px; font-size: 0.8rem;">V</div>
                    <div class="message">Sesi baru dimulai. Ada yang bisa dibantu lagi, Yusup?</div>
                </div>
            `;
        }
    </script>
</body>
  </html>
